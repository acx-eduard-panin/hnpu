# Publishes the already-built, encrypted site (physics-site/docs) to GitHub Pages.
# Build locally with `node build.mjs` — the plaintext data and password never reach CI.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["physics-site/docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: physics-site/docs
      - id: deployment
        uses: actions/deploy-pages@v4
